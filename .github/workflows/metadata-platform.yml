name: Metadata Platform Extractor

on:
  workflow_dispatch:

jobs:
  run-extractor:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python version
        run: |
          python --version

      - name: Create virtual environment
        run: |
          python -m venv .venv

      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run SQL metadata extractor
        run: |
          .\.venv\Scripts\python.exe extractors/sql_extractor.py