name: Metadata Platform Extractor

on:
  workflow_dispatch:

jobs:
  run-extractor:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run SQL metadata extractor
        run: |
          python extractors/sql_extractor.py